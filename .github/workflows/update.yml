# Every US trading day after the close: fetch prices, save them into the repo, rebuild, publish to GitHub Pages.
name: อัปเดตราคา

on:
  schedule:
    # UTC. US market closes 20:00 (summer) / 21:00 (winter) UTC → 22:15 is after both. Tue–Sat 05:15 Thai time.
    - cron: '15 22 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      # A code push publishes what is already in the repo; only the schedule (or a manual run) fetches new prices.
      - name: ดึงราคาและงบ
        if: github.event_name != 'push'
        run: node scripts/fetch-data.ts

      - name: ดึงรายการซื้อขายของผู้บริหาร
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/fetch-insiders.ts

      # [skip ci] + the default token: this commit does not start another run
      - name: เก็บข้อมูลลง repo
        if: github.event_name != 'push'
        run: |
          git config user.name "aomdiwa-bot"
          git config user.email "aomdiwa-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "ข้อมูลราคา $(date -u +%F) [skip ci]"
          git pull --rebase --autostash
          git push

      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # GitHub pauses scheduled jobs in public repos after 60 quiet days; re-enabling keeps it running.
      - name: กันตารางเวลาหยุดเอง
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
